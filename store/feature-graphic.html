<!doctype html>
<!-- Google Play feature graphic (1024×500). Render: open at a 1024×500 viewport and screenshot to feature-graphic.png. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: #fff9f5;
        font-family: "Fredoka", sans-serif;
        color: #334155;
      }
      .wrap {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 64px;
        gap: 48px;
        box-sizing: border-box;
      }
      img {
        width: 380px;
        height: 380px;
        object-fit: contain;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 104px;
        font-weight: 700;
        color: #3b82f6;
        line-height: 1;
      }
      p {
        margin: 20px 0 0;
        font-size: 44px;
        font-weight: 600;
        line-height: 1.15;
      }
      em {
        color: #3b82f6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="../frontend/public/globe.png" alt="" />
      <div>
        <h1>GeoHearo</h1>
        <p>The geo-guessing game where you <em>win with your ears.</em></p>
      </div>
    </div>
  </body>
</html>
